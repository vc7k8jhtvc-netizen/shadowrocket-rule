name: Check external dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/check-external-dependencies.yml'
      - 'scripts/check-external-dependencies.sh'
      - 'scripts/check-external-dependencies.test.sh'
      - 'scripts/check-clash-script.js'
      - 'scripts/check-youtube-module.js'
      - 'Clash_Verge_Rev_Script.js'
      - 'Shadowrocket_Routing.conf'
      - 'YouTube.Enhance.Shadowrocket.sgmodule'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate external-check script syntax
        run: bash -n scripts/check-external-dependencies.sh scripts/check-external-dependencies.test.sh
      - name: Run external-check offline regressions
        run: bash scripts/check-external-dependencies.test.sh
      - name: Validate local YouTube module contract
        run: node scripts/check-youtube-module.js

  live-upstreams:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local YouTube module contract
        run: node scripts/check-youtube-module.js
      - name: Smoke-test live Maasea and Blackmatrix dependencies
        run: bash scripts/check-external-dependencies.sh
