name: Check configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run static configuration checks
        run: bash scripts/check-config.sh

      - name: Generate Mihomo test configuration
        env:
          MIHOMO_CONFIG_OUTPUT: ${{ runner.temp }}/generated-mihomo.json
        run: node scripts/check-clash-script.js Clash_Verge_Rev_Script.js

      - name: Validate with Mihomo core v1.19.31
        env:
          MIHOMO_VERSION: v1.19.31
        run: |
          archive="${RUNNER_TEMP}/mihomo.gz"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz" -o "${archive}"
          echo "d5e74bbddbdfff49a1aef7775bf5911da59f0d7196ed509a0ac914b3653dd5f1  ${archive}" | sha256sum -c -
          gzip -dc "${archive}" > "${RUNNER_TEMP}/mihomo"
          chmod +x "${RUNNER_TEMP}/mihomo"
          "${RUNNER_TEMP}/mihomo" -t -f "${RUNNER_TEMP}/generated-mihomo.json"
          node scripts/check-mihomo-runtime.js "${RUNNER_TEMP}/mihomo"
