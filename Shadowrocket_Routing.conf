# 小火箭分流配置
# 版本：v2.7.19
# 本配置仅负责代理分组与正常分流；不加载通用广告黑名单。
# WestData.conf 负责节点、General/DNS/TUN、Host、URL Rewrite、MITM 等基础设置。
# YouTube 增强模块独立维护 YouTube 专属脚本及 MITM 主机。
# 当前配置优先于被包含的配置；请保留并正常更新 WestData.conf。

[General]
include = WestData.conf

[Proxy Group]
# 总控
🚀 默认代理 = select,🇭🇰 香港,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,🏝️ 台湾,👆 手动选择,select=0
👆 手动选择 = select,policy-regex-filter=^.+ \| .+$,select=0

# 业务分组
🤖 AI = select,🇸🇬 新加坡,🇺🇸 美国,🇯🇵 日本,🚀 默认代理,select=0
🍎 Apple = select,DIRECT,🚀 默认代理,🇭🇰 香港,🇺🇸 美国,🇯🇵 日本,👆 手动选择,select=0
🔎 Google = select,🚀 默认代理,🇺🇸 美国,🇯🇵 日本,🇸🇬 新加坡,select=0
💻 GitHub = select,🚀 默认代理,🇺🇸 美国,select=0
🪟 Microsoft = select,DIRECT,🚀 默认代理,🇺🇸 美国,👆 手动选择,select=0
📱 社交媒体 = select,🚀 默认代理,🇺🇸 美国,🇸🇬 新加坡,🇯🇵 日本,select=0
▶️ YouTube = select,🚀 默认代理,🇯🇵 日本,🇺🇸 美国,🇸🇬 新加坡,select=0
✈️ Telegram = select,🚀 默认代理,🇸🇬 新加坡,🇭🇰 香港,🇯🇵 日本,select=0
🧩 自定义 = select,🚀 默认代理,🇺🇸 美国,🇯🇵 日本,🇸🇬 新加坡,select=0

# 功能分组
🐟 漏网之鱼 = select,🚀 默认代理,DIRECT,🇺🇸 美国,🇯🇵 日本,🇸🇬 新加坡,👆 手动选择,select=0

# 地区节点池
🇭🇰 香港 = select,policy-regex-filter=^.*Hong Kong \| .+$,select=0
🏝️ 台湾 = select,policy-regex-filter=^.*Taiwan \| .+$,select=0
🇸🇬 新加坡 = select,policy-regex-filter=^.*Singapore \| .+$,select=0
🇯🇵 日本 = select,policy-regex-filter=^.*Japan \| .+$,select=0
🇺🇸 美国 = select,policy-regex-filter=^.*United States \| .+$,select=0

