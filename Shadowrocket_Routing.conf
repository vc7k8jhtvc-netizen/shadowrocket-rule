# Shadowrocket 分流配置
# 版本：v2.7.30
# 职责：代理分组与分流规则；基础网络参数由 WestData.conf 提供。
# 不含通用广告拦截；YouTube 增强由独立模块维护。

[General]
# 节点、DNS、TUN、Host、URL Rewrite 与 MITM 等由 WestData.conf 提供。
include = WestData.conf

[Proxy Group]
# ===== 核心选择器 =====
🚀 默认代理 = select,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0
👆 手动选择 = select,policy-regex-filter=^.+ \| .+$,select=0

# ===== 业务分组 =====
🤖 AI = select,🇸🇬 新加坡,🇭🇰 香港,🏝️ 台湾,🇯🇵 日本,🇺🇸 美国,🚀 默认代理,👆 手动选择,select=0
🍎 Apple = select,DIRECT,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,🚀 默认代理,👆 手动选择,select=0
🔎 Google = select,🚀 默认代理,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0
💻 GitHub = select,🚀 默认代理,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0
🪟 Microsoft = select,DIRECT,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,🚀 默认代理,👆 手动选择,select=0
📱 社交媒体 = select,🚀 默认代理,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0
▶️ YouTube = select,🚀 默认代理,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0
✈️ Telegram = select,🚀 默认代理,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0
🧩 自定义 = select,🚀 默认代理,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0

# ===== 兜底 =====
🐟 漏网之鱼 = select,🚀 默认代理,DIRECT,🇭🇰 香港,🏝️ 台湾,🇸🇬 新加坡,🇯🇵 日本,🇺🇸 美国,👆 手动选择,select=0

# ===== 地区节点池 =====
🇭🇰 香港 = select,policy-regex-filter=^.*Hong Kong \| .+$,select=0
🏝️ 台湾 = select,policy-regex-filter=^.*Taiwan \| .+$,select=0
🇸🇬 新加坡 = select,policy-regex-filter=^.*Singapore \| .+$,select=0
🇯🇵 日本 = select,policy-regex-filter=^.*Japan \| .+$,select=0
🇺🇸 美国 = select,policy-regex-filter=^.*United States \| .+$,select=0

